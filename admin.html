<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그로스보드 - Admin</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    button:hover { opacity: 0.9; }
    input:focus { border-color: #3182F6 !important; outline: none; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #DDD; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyALgLMu9taflcnSnydKRruhYpXDC9TFBtE",
      authDomain: "growthboard-e79f8.firebaseapp.com",
      databaseURL: "https://growthboard-e79f8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "growthboard-e79f8",
      storageBucket: "growthboard-e79f8.firebasestorage.app",
      messagingSenderId: "863471619047",
      appId: "1:863471619047:web:8fe329ab0ee765317c0b42"
    };

    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch (e) {}

    const TEAMS_DATA = {
      "대표이사실": ["이승우"],
      "경영관리본부": ["백정석"],
      "경영관리팀": ["신나영", "주유진", "김유림"],
      "그로스팀": ["이재훈", "김범석"],
      "영업본부": ["황윤선"],
      "서비스운영1팀": ["한준엽", "조재연", "정정훈", "김성민", "한지혜"],
      "서비스운영2팀": ["권정아", "김수진"],
      "서비스운영3팀": ["주현진", "송보람"],
      "아파트스퀘어팀": ["한인규"],
      "적산팀": ["김영성", "신수진"],
      "설계/적산팀": ["조현식"],
      "기술연구소": ["신명희", "심혜진", "김소정"],
      "브랜드마케팅팀": ["권혜영", "함지민", "김소라", "손예진", "최경선"],
      "커머스사업본부": ["허지은"],
      "브랜드커머스팀": ["이란", "김민지"],
      "미디어커머스팀": ["방현수", "김소연", "남윤정"],
      "해외사업팀": ["김채원", "쩐티리"],
      "모여라딜팀": ["김송희", "이채은"]
    };

    // 본부별 색상 통일
    const TEAM_COLORS = {
      "대표이사실": "#191F28",
      // 경영관리본부 계열 (파란색)
      "경영관리본부": "#3182F6", "경영관리팀": "#3182F6", "그로스팀": "#5B9DF6",
      // 영업본부 계열 (보라색)
      "영업본부": "#9B59B6", "서비스운영1팀": "#9B59B6", "서비스운영2팀": "#A96DC7", "서비스운영3팀": "#B77FD8",
      "아파트스퀘어팀": "#9B59B6", "적산팀": "#A96DC7", "설계/적산팀": "#B77FD8",
      // 기술연구소 (독립 - 진한 청록색)
      "기술연구소": "#0891B2",
      // 브랜드마케팅팀 (독립 - 주황색)
      "브랜드마케팅팀": "#F39C12",
      // 커머스사업본부 계열 (레드/핑크 계열)
      "커머스사업본부": "#E11D48", "브랜드커머스팀": "#E11D48", "미디어커머스팀": "#F43F5E",
      "해외사업팀": "#FB7185", "모여라딜팀": "#E11D48"
    };

    // 업로드 체크 제외 인원 (그로스데이 채점만 참여)
    const EXCLUDED_FROM_UPLOAD = ["백정석", "황윤선", "조현식", "허지은"];

    const REGULAR_TEAMS = Object.fromEntries(Object.entries(TEAMS_DATA).filter(([team]) => team !== "대표이사실"));

    const getWeekInfo = (date = new Date()) => {
      const d = new Date(date);
      const dayOfWeek = d.getDay();
      const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      const monday = new Date(d);
      monday.setDate(d.getDate() - daysSinceMonday);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const weekId = monday.getFullYear() + '-' + String(monday.getMonth()+1).padStart(2,'0') + '-' + String(monday.getDate()).padStart(2,'0');
      const label = monday.getMonth() === sunday.getMonth() 
        ? (monday.getMonth()+1) + '/' + monday.getDate() + '~' + sunday.getDate()
        : (monday.getMonth()+1) + '/' + monday.getDate() + '~' + (sunday.getMonth()+1) + '/' + sunday.getDate();
      return { weekId, monday, sunday, label };
    };

    const generateEmptyUploadStatus = () => {
      const status = {};
      Object.entries(REGULAR_TEAMS).forEach(([team, members]) => {
        members.filter(m => !EXCLUDED_FROM_UPLOAD.includes(m)).forEach(member => { status[member] = { team, weeks: {} }; });
      });
      return status;
    };

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('growthboard_admin_logged_in') === 'true');
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [uploadStatus, setUploadStatus] = useState(generateEmptyUploadStatus());
      const [scores, setScores] = useState({});
      const [growthdayActive, setGrowthdayActive] = useState(false);
      const [growthdayQuarter, setGrowthdayQuarter] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [selectedWeek, setSelectedWeek] = useState(getWeekInfo().weekId);
      const [toast, setToast] = useState(null);
      const [selectedTeamFilter, setSelectedTeamFilter] = useState('all');
      const [showMissingModal, setShowMissingModal] = useState(false);
      const [showGrowthdayModal, setShowGrowthdayModal] = useState(false);
      const [pins, setPins] = useState({});

      useEffect(() => {
        if (!db) { setIsLoading(false); return; }
        
        // 타임아웃 설정 (5초 후에도 로딩 중이면 강제 해제)
        const timeout = setTimeout(() => {
          setIsLoading(false);
          console.log('Firebase 연결 타임아웃');
        }, 5000);
        
        const uploadRef = db.ref('uploadStatus');
        uploadRef.on('value', (snapshot) => {
          clearTimeout(timeout);
          const data = snapshot.val();
          if (data) {
            setUploadStatus(() => {
              const merged = generateEmptyUploadStatus();
              Object.keys(data).forEach(member => {
                if (merged[member]) merged[member].weeks = data[member].weeks || {};
              });
              return merged;
            });
          }
          setIsLoading(false);
        }, (error) => {
          clearTimeout(timeout);
          console.error('Firebase 데이터 로드 오류:', error);
          setIsLoading(false);
        });
        const scoresRef = db.ref('scores');
        scoresRef.on('value', (snapshot) => { if (snapshot.val()) setScores(snapshot.val()); }, (error) => console.error('scores 로드 오류:', error));
        const growthdayRef = db.ref('growthday');
        growthdayRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) { setGrowthdayActive(data.active || false); setGrowthdayQuarter(data.quarter || ''); }
        }, (error) => console.error('growthday 로드 오류:', error));
        
        const pinsRef = db.ref('pins');
        pinsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) setPins(data);
        }, (error) => console.error('pins 로드 오류:', error));
        
        return () => { clearTimeout(timeout); uploadRef.off(); scoresRef.off(); growthdayRef.off(); pinsRef.off(); };
      }, []);

      useEffect(() => { localStorage.setItem('growthboard_admin_logged_in', isLoggedIn.toString()); }, [isLoggedIn]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

      const handleUploadToggle = (member, weekId) => {
        if (!db) { showToast('Firebase 연결 필요'); return; }
        const newStatus = !(uploadStatus[member]?.weeks?.[weekId] || false);
        db.ref('uploadStatus/' + member + '/weeks/' + weekId).set(newStatus)
          .then(() => showToast(member + '님의 업로드 상태가 변경되었습니다'))
          .catch((error) => { console.error('Firebase 쓰기 오류:', error); showToast('저장 실패: Firebase 권한을 확인하세요'); });
      };

      const handleGrowthdayStart = (year, quarter, round) => {
        if (!db) { showToast('Firebase 연결 필요'); return; }
        const quarterName = year + '년 ' + quarter + '분기 ' + round + '차';
        db.ref('growthday').set({ active: true, quarter: quarterName })
          .then(() => { setShowGrowthdayModal(false); showToast(quarterName + ' 그로스데이가 시작되었습니다'); })
          .catch((error) => { console.error('Firebase 쓰기 오류:', error); showToast('저장 실패: Firebase 권한을 확인하세요'); });
      };

      const handleGrowthdayStop = () => {
        if (!db) { showToast('Firebase 연결 필요'); return; }
        db.ref('growthday/active').set(false)
          .then(() => showToast('그로스데이가 종료되었습니다'))
          .catch((error) => { console.error('Firebase 쓰기 오류:', error); showToast('저장 실패: Firebase 권한을 확인하세요'); });
      };

      const handlePinReset = (memberName) => {
        if (!db) { showToast('Firebase 연결 필요'); return; }
        if (!window.confirm(`${memberName}님의 PIN을 초기화하시겠습니까?`)) return;
        db.ref(`pins/${memberName}`).remove()
          .then(() => showToast(`${memberName}님의 PIN이 초기화되었습니다`))
          .catch((error) => { console.error('PIN 초기화 오류:', error); showToast('초기화 실패: Firebase 권한을 확인하세요'); });
      };

      const handlePinResetAll = () => {
        if (!db) { showToast('Firebase 연결 필요'); return; }
        const pinCount = Object.keys(pins).length;
        if (pinCount === 0) { showToast('초기화할 PIN이 없습니다'); return; }
        if (!window.confirm(`⚠️ 전체 ${pinCount}명의 PIN을 초기화하시겠습니까?\n\n모든 직원이 다시 PIN을 설정해야 합니다.`)) return;
        db.ref('pins').remove()
          .then(() => showToast(`전체 ${pinCount}명의 PIN이 초기화되었습니다`))
          .catch((error) => { console.error('전체 PIN 초기화 오류:', error); showToast('초기화 실패: Firebase 권한을 확인하세요'); });
      };

      const handleDeleteScore = (presenter, voter, quarter) => {
        if (!db) { showToast('Firebase 연결 필요'); return; }
        const targetQuarter = quarter || growthdayQuarter;
        if (!window.confirm(`${voter}님이 ${presenter}님에게 준 점수를 삭제하시겠습니까?`)) return;
        db.ref(`scores/${targetQuarter}/${presenter}/${voter}`).remove()
          .then(() => showToast(`${voter}님의 점수가 삭제되었습니다`))
          .catch((error) => { console.error('Firebase 삭제 오류:', error); showToast('삭제 실패: Firebase 권한을 확인하세요'); });
      };

      const handleUpdateScore = (presenter, voter, newScores, isCEO, quarter) => {
        if (!db) { showToast('Firebase 연결 필요'); return; }
        const targetQuarter = quarter || growthdayQuarter;
        db.ref(`scores/${targetQuarter}/${presenter}/${voter}`).set({ scores: newScores, isCEO })
          .then(() => showToast(`${voter}님의 점수가 수정되었습니다`))
          .catch((error) => { console.error('Firebase 수정 오류:', error); showToast('수정 실패: Firebase 권한을 확인하세요'); });
      };

      const getStats = () => {
        const totalMembers = Object.keys(uploadStatus).length;
        const currentWeekUploads = Object.values(uploadStatus).filter(s => s.weeks?.[selectedWeek]).length;
        const teamStats = {};
        Object.entries(REGULAR_TEAMS).forEach(([team, members]) => {
          const uploaded = members.filter(m => uploadStatus[m]?.weeks?.[selectedWeek]).length;
          teamStats[team] = { total: members.length, uploaded, rate: Math.round((uploaded / members.length) * 100) };
        });
        const missingMembers = [];
        Object.entries(uploadStatus).forEach(([name, data]) => {
          if (!data.weeks?.[selectedWeek]) missingMembers.push({ name, team: data.team });
        });
        return { totalMembers, currentWeekUploads, overallRate: Math.round((currentWeekUploads / totalMembers) * 100), teamStats, missingMembers };
      };

      const getGrowthdayStats = () => {
        const quarterScores = scores[growthdayQuarter] || {};
        const results = [];
        Object.entries(quarterScores).forEach(([presenter, voters]) => {
          const voterList = Object.entries(voters);
          if (voterList.length === 0) return;
          
          const voterDetails = [];
          const ceoVoters = [];
          const regularVoters = [];
          
          voterList.forEach(([voter, data]) => {
            const baseScore = Object.values(data.scores).reduce((a, b) => a + b, 0);
            const finalScore = data.isCEO ? baseScore * 2 : baseScore;
            const voterTeam = Object.entries(TEAMS_DATA).find(([t, members]) => members.includes(voter))?.[0] || '';
            const voterData = { name: voter, team: voterTeam, baseScore, finalScore, isCEO: data.isCEO };
            voterDetails.push(voterData);
            
            if (data.isCEO) {
              ceoVoters.push(voterData);
            } else {
              regularVoters.push(voterData);
            }
          });
          
          // 일반 평가자 중 최고점/최저점 제외 (3명 이상일 때만)
          let filteredRegularVoters = [...regularVoters];
          let excludedVoters = [];
          if (regularVoters.length >= 3) {
            const sorted = [...regularVoters].sort((a, b) => a.finalScore - b.finalScore);
            const minVoter = sorted[0];
            const maxVoter = sorted[sorted.length - 1];
            excludedVoters = [minVoter.name, maxVoter.name];
            filteredRegularVoters = regularVoters.filter(v => v.name !== minVoter.name && v.name !== maxVoter.name);
          }
          
          // 평균 계산: 대표 + 필터링된 일반 평가자
          const countedVoters = [...ceoVoters, ...filteredRegularVoters];
          const totalScore = countedVoters.reduce((sum, v) => sum + v.finalScore, 0);
          const averageScore = countedVoters.length > 0 ? totalScore / countedVoters.length : 0;
          
          const team = Object.entries(TEAMS_DATA).find(([t, members]) => members.includes(presenter))?.[0] || '';
          results.push({ 
            name: presenter, 
            team, 
            voterCount: voterList.length, 
            countedVoterCount: countedVoters.length,
            averageScore: averageScore.toFixed(1), 
            ceoVoted: ceoVoters.length > 0, 
            voterDetails: voterDetails.map(v => ({...v, excluded: excludedVoters.includes(v.name)})), 
            totalScore,
            excludedVoters
          });
        });
        return results.sort((a, b) => parseFloat(b.averageScore) - parseFloat(a.averageScore));
      };

      const stats = getStats();
      const growthdayStats = getGrowthdayStats();

      if (isLoading) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',backgroundColor:'#F7F8FA'}}><div style={{textAlign:'center'}}><div style={{fontSize:'24px',marginBottom:'12px'}}>⏳</div><div style={{color:'#666'}}>로딩 중...</div></div></div>;
      if (!isLoggedIn) return <AdminLoginScreen onLogin={() => setIsLoggedIn(true)} />;

      return (
        <div style={styles.container}>
          {toast && <div style={styles.toast}>✓ {toast}</div>}
          {showMissingModal && <MissingModal stats={stats} selectedWeek={selectedWeek} onClose={() => setShowMissingModal(false)} onToggle={handleUploadToggle} />}
          {showGrowthdayModal && <GrowthdayStartModal onClose={() => setShowGrowthdayModal(false)} onStart={handleGrowthdayStart} />}
          <header style={styles.header}>
            <div style={styles.headerContent}>
              <div style={styles.logo}><span style={styles.logoText}>그로스보드</span><span style={styles.adminBadge}>Admin</span></div>
              <nav style={styles.nav}>
                <button style={{...styles.navButton, ...(currentTab === 'dashboard' ? styles.navButtonActive : {})}} onClick={() => setCurrentTab('dashboard')}>대시보드</button>
                <button style={{...styles.navButton, ...(currentTab === 'members' ? styles.navButtonActive : {})}} onClick={() => setCurrentTab('members')}>인원 관리</button>
                <button style={{...styles.navButton, ...(currentTab === 'growthday' ? styles.navButtonActive : {})}} onClick={() => setCurrentTab('growthday')}>그로스데이 관리</button>
              </nav>
              <button style={styles.logoutBtn} onClick={() => setIsLoggedIn(false)}>로그아웃</button>
            </div>
          </header>
          <main style={styles.main}>
            {currentTab === 'dashboard' && <DashboardTab stats={stats} selectedWeek={selectedWeek} setSelectedWeek={setSelectedWeek} growthdayActive={growthdayActive} growthdayQuarter={growthdayQuarter} onMissingClick={() => setShowMissingModal(true)} uploadStatus={uploadStatus} />}
            {currentTab === 'members' && <MembersTab uploadStatus={uploadStatus} stats={stats} selectedWeek={selectedWeek} setSelectedWeek={setSelectedWeek} onToggle={handleUploadToggle} selectedTeamFilter={selectedTeamFilter} setSelectedTeamFilter={setSelectedTeamFilter} pins={pins} onPinReset={handlePinReset} onPinResetAll={handlePinResetAll} />}
            {currentTab === 'growthday' && <GrowthdayTab growthdayActive={growthdayActive} growthdayQuarter={growthdayQuarter} growthdayStats={growthdayStats} scores={scores} onStartClick={() => setShowGrowthdayModal(true)} onStop={handleGrowthdayStop} onDeleteScore={handleDeleteScore} onUpdateScore={handleUpdateScore} />}
          </main>
        </div>
      );
    }

    function AdminLoginScreen({ onLogin }) {
      const [id, setId] = useState('');
      const [pw, setPw] = useState('');
      const [error, setError] = useState('');
      const handleLogin = () => { if (id === 'admin' && pw === 'admin') onLogin(); else setError('아이디 또는 비밀번호가 올바르지 않습니다'); };
      return (
        <div style={styles.loginScreen}>
          <div style={styles.loginCard}>
            <div style={styles.loginHeader}><h1 style={styles.loginTitle}>그로스보드 Admin</h1><p style={styles.loginSubtitle}>관리자 계정으로 로그인해주세요</p></div>
            <div style={styles.inputGroup}><label style={styles.inputLabel}>아이디</label><input type="text" value={id} onChange={e => { setId(e.target.value); setError(''); }} onKeyPress={e => e.key === 'Enter' && handleLogin()} style={styles.input} placeholder="아이디를 입력하세요" /></div>
            <div style={styles.inputGroup}><label style={styles.inputLabel}>비밀번호</label><input type="password" value={pw} onChange={e => { setPw(e.target.value); setError(''); }} onKeyPress={e => e.key === 'Enter' && handleLogin()} style={styles.input} placeholder="비밀번호를 입력하세요" /></div>
            {error && <div style={styles.errorText}>{error}</div>}
            <button style={styles.loginBtn} onClick={handleLogin}>로그인</button>
          </div>
        </div>
      );
    }

    function MissingModal({ stats, selectedWeek, onClose, onToggle }) {
      const [year, month, day] = selectedWeek.split('-').map(Number);
      const monday = new Date(year, month - 1, day);
      const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
      const label = (monday.getMonth()+1) + '/' + monday.getDate() + '~' + (sunday.getMonth()+1) + '/' + sunday.getDate();
      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHeader}><h3 style={styles.modalTitle}>미업로드 인원 <span style={styles.modalCount}>{stats.missingMembers.length}명</span></h3><button style={styles.modalClose} onClick={onClose}>✕</button></div>
            <div style={styles.modalSubtitle}>{label} 기준</div>
            <div style={styles.missingList}>
              {stats.missingMembers.length === 0 ? <div style={styles.emptyMissing}>✓ 모든 인원이 업로드를 완료했습니다!</div> :
                Object.entries(REGULAR_TEAMS).map(([team]) => {
                  const missingInTeam = stats.missingMembers.filter(m => m.team === team);
                  if (missingInTeam.length === 0) return null;
                  return (
                    <div key={team} style={styles.missingTeamGroup}>

    function WeekCalendar({ selectedWeek, setSelectedWeek, uploadStatus }) {
      const [currentMonth, setCurrentMonth] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const days = [];
        let startDay = firstDay.getDay();
        startDay = startDay === 0 ? 6 : startDay - 1;
        for (let i = 0; i < startDay; i++) {
          const prevDate = new Date(year, month, -startDay + i + 1);
          days.push({ date: prevDate, isCurrentMonth: false });
        }
        for (let i = 1; i <= lastDay.getDate(); i++) {
          days.push({ date: new Date(year, month, i), isCurrentMonth: true });
        }
        const remainingDays = 7 - (days.length % 7);
        if (remainingDays < 7) {
          for (let i = 1; i <= remainingDays; i++) {
            days.push({ date: new Date(year, month + 1, i), isCurrentMonth: false });
          }
        }
        return days;
      };

      const getWeekIdFromDate = (date) => {
        const d = new Date(date);
        const dayOfWeek = d.getDay();
        const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        const monday = new Date(d);
        monday.setDate(d.getDate() - daysSinceMonday);
        return monday.getFullYear() + '-' + String(monday.getMonth()+1).padStart(2,'0') + '-' + String(monday.getDate()).padStart(2,'0');
      };

      const getWeekUploadRate = (weekId) => {
        const totalMembers = Object.keys(uploadStatus).length;
        if (totalMembers === 0) return 0;
        const uploaded = Object.values(uploadStatus).filter(s => s.weeks?.[weekId]).length;
        return Math.round((uploaded / totalMembers) * 100);
      };

      const days = getDaysInMonth(currentMonth);
      const weeks = [];
      for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

      const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));
      const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
      const goToToday = () => {
        const today = new Date();
        setCurrentMonth(new Date(today.getFullYear(), today.getMonth(), 1));
        setSelectedWeek(getWeekIdFromDate(today));
      };

      const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
      const dayNames = ['월', '화', '수', '목', '금', '토', '일'];

      return (
        <div style={styles.calendarContainer}>
          <div style={styles.calendarHeader}>
            <button style={styles.calendarNavBtn} onClick={prevMonth}>◀</button>
            <span style={styles.calendarTitle}>{currentMonth.getFullYear()}년 {monthNames[currentMonth.getMonth()]}</span>
            <button style={styles.calendarNavBtn} onClick={nextMonth}>▶</button>
            <button style={styles.todayBtn} onClick={goToToday}>오늘</button>
          </div>
          <div style={styles.calendarDayNames}>{dayNames.map(day => <div key={day} style={styles.calendarDayName}>{day}</div>)}<div style={styles.calendarDayName}>진행률</div></div>
          <div style={styles.calendarBody}>
            {weeks.map((week, weekIndex) => {
              const weekId = getWeekIdFromDate(week[0].date);
              const isSelected = weekId === selectedWeek;
              const uploadRate = getWeekUploadRate(weekId);
              return (
                <div key={weekIndex} style={{...styles.calendarWeekRow, ...(isSelected ? styles.calendarWeekRowSelected : {}), cursor: 'pointer'}} onClick={() => setSelectedWeek(weekId)}>
                  {week.map((dayObj, dayIndex) => {
                    const isToday = dayObj.date.toDateString() === new Date().toDateString();
                    return (
                      <div key={dayIndex} style={{...styles.calendarDay, ...(dayObj.isCurrentMonth ? {} : styles.calendarDayOtherMonth), ...(isToday ? styles.calendarDayToday : {}), ...(dayIndex >= 5 ? styles.calendarDayWeekend : {})}}>
                        {dayObj.date.getDate()}
                      </div>
                    );
                  })}
                  <div style={{...styles.weekUploadRate, color: uploadRate === 100 ? '#00C471' : uploadRate > 0 ? '#3182F6' : '#CCC'}}>{uploadRate}%</div>
                </div>
              );
            })}
          </div>
          <div style={styles.calendarLegend}>
            <span style={styles.legendItem}><span style={{...styles.legendDot, backgroundColor: '#00C471'}}></span> 완료</span>
            <span style={styles.legendItem}><span style={{...styles.legendDot, backgroundColor: '#3182F6'}}></span> 진행중</span>
            <span style={styles.legendItem}><span style={{...styles.legendDot, backgroundColor: '#CCC'}}></span> 미시작</span>
          </div>
        </div>
      );
    }

          '</div>';
        
        // 팀 카드 HTML 생성 함수
        const createTeamCardHtml = (teamData) => {

          // PDF에 배치

          let yPos = margin;
          
          // 헤더 추가
          pdf.addImage(headerImg, 'PNG', margin, yPos, contentWidth, headerImgHeight);

          // 2열 배치
          let col = 0;
          let colYPos = [yPos, yPos];
          
          for (const card of teamCards) {

            if (colYPos[col] + card.height > pageHeight - margin) {
              // 다른 열 확인

    function GrowthdayTab({ growthdayActive, growthdayQuarter, growthdayStats, scores, onStartClick, onStop, onDeleteScore, onUpdateScore }) {
      const [selectedPresenter, setSelectedPresenter] = useState(null);
      const [isExporting, setIsExporting] = useState(false);
      const [editingVoter, setEditingVoter] = useState(null);
      const [editScores, setEditScores] = useState({});
      const [selectedViewQuarter, setSelectedViewQuarter] = useState('');
      
      // scores에서 모든 분기 목록 추출 (최신순 정렬)
      const scoreQuarters = Object.keys(scores || {}).sort((a, b) => {
        const parseQuarter = (q) => {
          // "2026년 1분기 2차" 또는 "2026년 1분기" 형식 파싱
          const match = q.match(/(\d+)년\s*(\d+)분기(?:\s*(\d+)차)?/);
          if (match) {
            const year = parseInt(match[1]);
            const quarter = parseInt(match[2]);
            const round = match[3] ? parseInt(match[3]) : 0;
            return year * 100 + quarter * 10 + round;
          }
          return 0;
        };
        return parseQuarter(b) - parseQuarter(a);
      });
      
      // 현재 진행중인 분기가 scores에 없으면 드롭다운에 추가
      const allQuarters = React.useMemo(() => {
        const quarters = [...scoreQuarters];
        if (growthdayActive && growthdayQuarter && !quarters.includes(growthdayQuarter)) {
          quarters.unshift(growthdayQuarter);
        }
        return quarters;
      }, [scoreQuarters, growthdayActive, growthdayQuarter]);
      
      // 초기값 설정: 현재 활성화된 분기 우선
      React.useEffect(() => {
        if (growthdayActive && growthdayQuarter) {
          setSelectedViewQuarter(growthdayQuarter);
        } else if (!selectedViewQuarter && allQuarters.length > 0) {
          setSelectedViewQuarter(allQuarters[0]);
        }
      }, [growthdayActive, growthdayQuarter, allQuarters]);
      
      // 선택된 분기의 통계 계산 (최고/최저점 제외 로직 포함)
      const getQuarterStats = (quarter) => {
        const quarterScores = scores[quarter] || {};
        const results = [];
        Object.entries(quarterScores).forEach(([presenter, voters]) => {
          const voterList = Object.entries(voters);
          if (voterList.length === 0) return;
          
          const voterDetails = [];
          const ceoVoters = [];
          const regularVoters = [];
          
          voterList.forEach(([voter, data]) => {
            const baseScore = Object.values(data.scores).reduce((a, b) => a + b, 0);
            const finalScore = data.isCEO ? baseScore * 2 : baseScore;
            const voterTeam = Object.entries(TEAMS_DATA).find(([t, members]) => members.includes(voter))?.[0] || '';
            const voterData = { name: voter, team: voterTeam, baseScore, finalScore, isCEO: data.isCEO };
            voterDetails.push(voterData);
            
            if (data.isCEO) {
              ceoVoters.push(voterData);
            } else {
              regularVoters.push(voterData);
            }
          });
          
          let filteredRegularVoters = [...regularVoters];
          let excludedVoters = [];
          if (regularVoters.length >= 3) {
            const sorted = [...regularVoters].sort((a, b) => a.finalScore - b.finalScore);
            const minVoter = sorted[0];
            const maxVoter = sorted[sorted.length - 1];
            excludedVoters = [minVoter.name, maxVoter.name];
            filteredRegularVoters = regularVoters.filter(v => v.name !== minVoter.name && v.name !== maxVoter.name);
          }
          
          const countedVoters = [...ceoVoters, ...filteredRegularVoters];
          const totalScore = countedVoters.reduce((sum, v) => sum + v.finalScore, 0);
          const averageScore = countedVoters.length > 0 ? totalScore / countedVoters.length : 0;
          
          const team = Object.entries(TEAMS_DATA).find(([t, members]) => members.includes(presenter))?.[0] || '';
          results.push({ 
            name: presenter, 
            team, 
            voterCount: voterList.length, 
            countedVoterCount: countedVoters.length,
            averageScore: averageScore.toFixed(1), 
            ceoVoted: ceoVoters.length > 0, 
            voterDetails: voterDetails.map(v => ({...v, excluded: excludedVoters.includes(v.name)})), 
            totalScore,
            excludedVoters
          });
        });
        return results.sort((a, b) => parseFloat(b.averageScore) - parseFloat(a.averageScore));
      };
      
      const viewStats = selectedViewQuarter ? getQuarterStats(selectedViewQuarter) : [];
      const selectedData = viewStats.find(r => r.name === selectedPresenter);

      const SCORING_CRITERIA = [
        { id: 'goal', name: '목표와 성과', maxScore: 30 },
        { id: 'growth', name: '개인 성장', maxScore: 20 },
        { id: 'learning', name: '학습/실패 공유', maxScore: 20 },
        { id: 'collaboration', name: '협업과 기여', maxScore: 15 },
        { id: 'presentation', name: '발표력', maxScore: 15 },
      ];

      const openEditModal = (presenter, voter) => {
        const voterData = scores[selectedViewQuarter]?.[presenter]?.[voter];
        if (voterData) {
          setEditScores(voterData.scores || {});
          setEditingVoter({ presenter, voter, isCEO: voterData.isCEO, quarter: selectedViewQuarter });
        }
      };

      const handleSaveEdit = () => {
        if (editingVoter) {
          onUpdateScore(editingVoter.presenter, editingVoter.voter, editScores, editingVoter.isCEO, editingVoter.quarter);
          setEditingVoter(null);
          setEditScores({});
        }
      };

      const exportToPDF = async () => {
        setIsExporting(true);
        
        // PDF용 임시 DOM 요소 생성
        const pdfContent = document.createElement('div');
        pdfContent.style.cssText = 'position: absolute; left: -9999px; top: 0; width: 800px; padding: 40px; background: white; font-family: Pretendard, sans-serif;';
        
        const today = new Date();
        const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
        
        pdfContent.innerHTML = `
          <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 28px; font-weight: 700; color: #191F28; margin-bottom: 8px;">그로스데이 점수 리포트</h1>
            <div style="font-size: 18px; color: #3182F6; font-weight: 600; margin-bottom: 4px;">${selectedViewQuarter}</div>
            <div style="font-size: 12px; color: #999;">생성일: ${dateStr}</div>
          </div>
          <div style="border-top: 2px solid #E5E5E5; padding-top: 20px; margin-bottom: 20px;">
            <div style="font-size: 14px; color: #333; margin-bottom: 15px;">총 발표자: <strong>${viewStats.length}명</strong> (최고/최저점 제외 후 평균)</div>
          </div>
          <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
            <thead>
              <tr style="background: #F7F8FA;">
                <th style="padding: 12px 8px; text-align: center; color: #666; font-weight: 600; width: 60px;">순위</th>
                <th style="padding: 12px 8px; text-align: left; color: #666; font-weight: 600;">이름</th>
                <th style="padding: 12px 8px; text-align: left; color: #666; font-weight: 600;">소속</th>
                <th style="padding: 12px 8px; text-align: center; color: #666; font-weight: 600; width: 80px;">반영인원</th>
                <th style="padding: 12px 8px; text-align: center; color: #666; font-weight: 600; width: 80px;">평균점수</th>
              </tr>
            </thead>
            <tbody>
              ${viewStats.map((result, index) => {
                const rankStyle = index === 0 ? 'background: #FFD700; color: white;' 
                  : index === 1 ? 'background: #C0C0C0; color: white;' 
                  : index === 2 ? 'background: #CD7F32; color: white;' : 'background: #F4F4F4; color: #666;';
                return `
                  <tr style="border-bottom: 1px solid #F4F4F4;">
                    <td style="padding: 14px 8px; text-align: center;">
                      <span style="display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; font-weight: 700; font-size: 12px; ${rankStyle}">${index + 1}</span>
                    </td>
                    <td style="padding: 14px 8px; font-weight: 600; color: #191F28;">${result.name}</td>
                    <td style="padding: 14px 8px; color: #666;">${result.team}</td>
                    <td style="padding: 14px 8px; text-align: center; color: #666;">${result.countedVoterCount}명 ${result.ceoVoted ? '⭐' : ''}</td>
                    <td style="padding: 14px 8px; text-align: center; font-weight: 700; color: #3182F6; font-size: 16px;">${result.averageScore}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
          <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #E5E5E5;">
            <div style="font-size: 11px; color: #999;">⭐ 대표이사 평가 (x2 배점 적용) · 최고점/최저점 각 1개 제외</div>
            <div style="font-size: 11px; color: #999; margin-top: 4px;">Netform Growth Board</div>
          </div>
        `;
        
        document.body.appendChild(pdfContent);
        
        try {
          const canvas = await html2canvas(pdfContent, { scale: 2, useCORS: true });
          const imgData = canvas.toDataURL('image/png');
          
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = pdf.internal.pageSize.getHeight();
          const imgWidth = pdfWidth - 20;
          const imgHeight = (canvas.height * imgWidth) / canvas.width;
          
          let heightLeft = imgHeight;
          let position = 10;
          
          pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
          heightLeft -= (pdfHeight - 20);
          
          while (heightLeft > 0) {
            position = heightLeft - imgHeight + 10;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
            heightLeft -= (pdfHeight - 20);
          }
          
          const fileName = '그로스데이_' + selectedViewQuarter.replace(/\s/g, '_') + '_' + dateStr + '.pdf';
          pdf.save(fileName);
        } catch (err) {
          console.error('PDF 생성 오류:', err);
          alert('PDF 생성 중 오류가 발생했습니다.');
        } finally {
          document.body.removeChild(pdfContent);
          setIsExporting(false);
        }
      };

      return (
        <div style={styles.page}>
          <div style={styles.pageHeader}><h1 style={styles.pageTitle}>그로스데이 관리</h1><p style={styles.pageSubtitle}>그로스데이 활성화 및 점수 현황을 관리하세요</p></div>
          <div style={styles.growthdayControlCard}>
            <div style={styles.growthdayControlHeader}><div><div style={styles.growthdayControlTitle}>그로스데이 배점</div><div style={styles.growthdayControlDesc}>{growthdayActive ? growthdayQuarter + ' 배점이 진행 중입니다' : '새로운 그로스데이를 시작하세요'}</div></div>{growthdayActive ? <button style={styles.stopBtn} onClick={onStop}>종료하기</button> : <button style={styles.startBtn} onClick={onStartClick}>시작하기</button>}</div>
            <div style={{...styles.statusBanner, backgroundColor: growthdayActive ? '#E8FFF3' : '#F4F4F4', color: growthdayActive ? '#00C471' : '#666'}}><div style={{...styles.statusDot, backgroundColor: growthdayActive ? '#00C471' : '#999'}} />{growthdayActive ? growthdayQuarter + ' 그로스데이 배점이 진행 중입니다' : '그로스데이 배점이 비활성화되어 있습니다'}</div>
          </div>
          <div style={styles.scoreInfoCard}>⭐ 대표이사님의 배점은 <strong>2배</strong>로 반영됩니다 (최대 200점) · 최고점/최저점 각 1개 제외</div>
          
          {/* 분기 선택 및 점수 현황 - 항상 표시 */}
          <div style={styles.scoresSection}>
            <div style={styles.scoresSectionHeader}>
              <div style={{display: 'flex', alignItems: 'center', gap: '16px'}}>
                <h3 style={styles.sectionTitle}>점수 현황</h3>
                <select 
                  value={selectedViewQuarter} 
                  onChange={(e) => { setSelectedViewQuarter(e.target.value); setSelectedPresenter(null); }}
                  style={{padding: '10px 16px', border: '1px solid #E5E5E5', borderRadius: '8px', fontSize: '14px', fontWeight: '600', backgroundColor: '#FFF', cursor: 'pointer', color: '#191F28'}}
                >
                  {allQuarters.length === 0 ? (
                    <option value="">데이터 없음</option>
                  ) : (
                    allQuarters.map(q => (
                      <option key={q} value={q}>{q} {q === growthdayQuarter && growthdayActive ? '(진행중)' : ''}</option>
                    ))
                  )}
                </select>
                <span style={styles.scoreCount}>{viewStats.length}명 발표</span>
              </div>
              {viewStats.length > 0 && <button style={{...styles.pdfExportBtn, opacity: isExporting ? 0.6 : 1}} onClick={exportToPDF} disabled={isExporting}>{isExporting ? '⏳ 생성 중...' : '📄 PDF 내보내기'}</button>}
            </div>
            {allQuarters.length === 0 ? (
              <div style={styles.emptyState}>아직 배점된 데이터가 없습니다</div>
            ) : viewStats.length === 0 ? (
              <div style={styles.emptyState}>선택된 분기에 배점된 점수가 없습니다</div>
            ) : (
              <div style={styles.scoresList}>
                {viewStats.map((result, index) => (
                  <div key={result.name} style={styles.scoreCard} onClick={() => setSelectedPresenter(result.name)}>
                    <div style={styles.scoreRank}>{index < 3 ? <div style={{...styles.rankBadge, backgroundColor: index === 0 ? '#FFD700' : index === 1 ? '#C0C0C0' : '#CD7F32'}}>{index + 1}</div> : <span style={styles.rankNumber}>{index + 1}</span>}</div>
                    <div style={{...styles.scoreAvatar, backgroundColor: TEAM_COLORS[result.team]}}>{result.name[0]}</div>
                    <div style={styles.scoreInfo}><div style={styles.scoreName}>{result.name}</div><div style={styles.scoreTeam}>{result.team}</div></div>
                    <div style={styles.scoreVoters}>{result.countedVoterCount}명 반영 {result.ceoVoted && '⭐'}</div>
                    <div style={styles.scoreTotalValue}><span style={styles.scoreNumber}>{result.averageScore}</span><span style={styles.scoreUnit}>점</span></div>
                    <span style={styles.detailArrow}>→</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          {selectedPresenter && selectedData && (
            <div style={styles.modalOverlay} onClick={() => setSelectedPresenter(null)}>
              <div style={styles.modal} onClick={e => e.stopPropagation()}>
                <div style={styles.modalHeader}><h3 style={styles.modalTitle}><div style={{...styles.modalAvatar, backgroundColor: TEAM_COLORS[selectedData.team]}}>{selectedData.name[0]}</div>{selectedData.name} 점수 상세</h3><button style={styles.modalClose} onClick={() => setSelectedPresenter(null)}>✕</button></div>
                <div style={styles.modalSubtitle}>{selectedData.team} · 평균 {selectedData.averageScore}점 ({selectedData.countedVoterCount}명 반영) · {selectedViewQuarter}</div>
                {selectedData.excludedVoters?.length > 0 && (
                  <div style={{padding: '10px 14px', backgroundColor: '#FFF8E6', borderRadius: '8px', marginBottom: '12px', fontSize: '13px', color: '#B8860B'}}>
                    ⚠️ 최고점/최저점 제외: {selectedData.excludedVoters.join(', ')}
                  </div>
                )}
                <div style={styles.voterList}>
                  {selectedData.voterDetails.map(voter => (
                    <div key={voter.name} style={{...styles.voterItem, opacity: voter.excluded ? 0.5 : 1, backgroundColor: voter.excluded ? '#F9F9F9' : 'transparent'}}>
                      <div style={styles.voterInfo}>
                        <div style={{...styles.voterAvatar, backgroundColor: TEAM_COLORS[voter.team]}}>{voter.name[0]}</div>
                        <div>
                          <div style={styles.voterName}>
                            {voter.name}
                            {voter.isCEO && <span style={styles.ceoBadgeSmall}>x2</span>}
                            {voter.excluded && <span style={{marginLeft: '6px', padding: '2px 6px', backgroundColor: '#FFE066', borderRadius: '4px', fontSize: '10px', fontWeight: '600', color: '#8B6914'}}>제외</span>}

                        <button style={{padding: '6px 10px', border: '1px solid #E54545', backgroundColor: '#FEF1F1', borderRadius: '6px', fontSize: '12px', fontWeight: '600', color: '#E54545', cursor: 'pointer'}} onClick={() => onDeleteScore(selectedData.name, voter.name, selectedViewQuarter)}>삭제</button>
                      </div>
                    </div>
                  ))}
                </div>
                <div style={styles.totalSummary}><span>평균 점수 ({selectedData.countedVoterCount}명 반영)</span><span style={styles.totalSummaryValue}>{selectedData.averageScore}점</span></div>
              </div>
            </div>
          )}

            <div style={styles.modalOverlay} onClick={() => setEditingVoter(null)}>
              <div style={{...styles.modal, maxWidth: '400px'}} onClick={e => e.stopPropagation()}>

                  <span style={{fontSize: '20px', fontWeight: '700', color: '#3182F6'}}>{Object.values(editScores).reduce((a, b) => a + b, 0)}</span>

              </div>
