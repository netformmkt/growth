<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그로스보드 - netform</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    button { cursor: pointer; transition: all 0.2s; }
    button:active { transform: scale(0.98); }
    input:focus { outline: none; }
    input[type="number"] { -webkit-appearance: none; -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #DDD; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyALgLMu9taflcnSnydKRruhYpXDC9TFBtE",
      authDomain: "growthboard-e79f8.firebaseapp.com",
      databaseURL: "https://growthboard-e79f8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "growthboard-e79f8",
      storageBucket: "growthboard-e79f8.firebasestorage.app",
      messagingSenderId: "863471619047",
      appId: "1:863471619047:web:8fe329ab0ee765317c0b42"
    };

    // Firebase 초기화
    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.log('Firebase 설정이 필요합니다.');
    }

    const TEAMS_DATA = {
      "대표이사실": ["이승우"],
      "경영관리본부": ["백정석"],
      "경영관리팀": ["신나영", "주유진", "김유림"],
      "그로스팀": ["이재훈", "김범석"],
      "영업본부": ["황윤선"],
      "서비스운영1팀": ["한준엽", "조재연", "정정훈", "김성민", "김경미"],
      "서비스운영2팀": ["권정아", "김수진", "이지연"],
      "서비스운영3팀": ["주현진", "송보람"],
      "아파트스퀘어팀": ["한인규"],
      "적산팀": ["김영성", "신수진", "정태윤"],
      "설계/적산팀": ["조현식"],
      "기술연구소": ["신명희", "심혜진", "김소정"],
      "브랜드마케팅팀": ["권혜영", "함지민", "김소라", "최경선"],
      "커머스사업본부": ["허지은"],
      "브랜드커머스팀": ["이란"],
      "미디어커머스팀": ["김소연", "이채은", "남윤정"],
      "해외사업팀": ["김채원", "쩐티리"],
      "모여라딜팀": ["김송희"]
    };

    // 본부별 색상 통일
    const TEAM_COLORS = {
      "대표이사실": "#191F28",
      // 경영관리본부 계열 (파란색)
      "경영관리본부": "#3182F6", "경영관리팀": "#3182F6", "그로스팀": "#5B9DF6",
      // 영업본부 계열 (보라색)
      "영업본부": "#9B59B6", "서비스운영1팀": "#9B59B6", "서비스운영2팀": "#A96DC7", "서비스운영3팀": "#B77FD8",
      "아파트스퀘어팀": "#9B59B6", "적산팀": "#A96DC7", "설계/적산팀": "#B77FD8",
      // 기술연구소 (독립 - 진한 청록색)
      "기술연구소": "#0891B2",
      // 브랜드마케팅팀 (독립 - 주황색)
      "브랜드마케팅팀": "#F39C12",
      // 커머스사업본부 계열 (레드/핑크 계열)
      "커머스사업본부": "#E11D48", "브랜드커머스팀": "#E11D48", "미디어커머스팀": "#F43F5E",
      "해외사업팀": "#FB7185", "모여라딜팀": "#E11D48"
    };

    // 업로드 체크 제외 인원 (그로스데이 채점만 참여)
    const EXCLUDED_FROM_UPLOAD = ["백정석", "황윤선", "조현식", "허지은"];

    const REGULAR_TEAMS = Object.fromEntries(Object.entries(TEAMS_DATA).filter(([team]) => team !== "대표이사실"));
    const REGULAR_MEMBERS = Object.values(REGULAR_TEAMS).flat();

    const SCORING_CRITERIA = [
      { id: 'goal', name: '목표와 성과', maxScore: 30 },
      { id: 'growth', name: '개인 성장', maxScore: 20 },
      { id: 'learning', name: '학습/실패 공유', maxScore: 20 },
      { id: 'collaboration', name: '협업과 기여', maxScore: 15 },
      { id: 'presentation', name: '발표력', maxScore: 15 },
    ];

    // 월요일~일요일 기준 주 계산
    const getWeekInfo = (date = new Date()) => {
      const d = new Date(date);
      const dayOfWeek = d.getDay();
      // 월요일을 주의 시작으로 (일요일=0을 6으로 변환)
      const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      
      const monday = new Date(d);
      monday.setDate(d.getDate() - daysSinceMonday);
      
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      
      const year = monday.getFullYear();
      const month = monday.getMonth() + 1;
      const day = monday.getDate();
      const weekId = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      const mondayMonth = monday.getMonth() + 1;
      const mondayDay = monday.getDate();
      const sundayMonth = sunday.getMonth() + 1;
      const sundayDay = sunday.getDate();
      
      let label = mondayMonth === sundayMonth 
        ? `${mondayMonth}/${mondayDay}~${sundayDay}` 
        : `${mondayMonth}/${mondayDay}~${sundayMonth}/${sundayDay}`;
      
      return { weekId, label };
    };

    const generateRecentWeeks = (count = 5) => {
      const weeks = []; const today = new Date(); const seen = new Set();
      for (let i = 0; i < count + 2; i++) {
        const targetDate = new Date(today); targetDate.setDate(today.getDate() - (i * 7));
        const weekInfo = getWeekInfo(targetDate);
        if (!seen.has(weekInfo.weekId)) { seen.add(weekInfo.weekId); weeks.unshift(weekInfo); }
        if (weeks.length >= count) break;
      }
      return weeks.slice(-count);
    };

    // 빈 업로드 상태 생성 (모두 미체크)
    const generateEmptyUploadStatus = () => {
      const status = {};
      Object.entries(REGULAR_TEAMS).forEach(([team, members]) => {
        members.forEach(member => {
          status[member] = { team, weeks: {} };
        });
      });
      return status;
    };

    const STORAGE_KEYS = {
      LOGGED_IN_USER: 'growthboard_logged_in_user_v5'
    };

    function App() {
      const [loggedInUser, setLoggedInUser] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEYS.LOGGED_IN_USER);
        return saved ? JSON.parse(saved) : null;
      });
      const [currentPage, setCurrentPage] = useState('upload');
      const [uploadStatus, setUploadStatus] = useState({});
      const [scores, setScores] = useState({});
      const [growthdayActive, setGrowthdayActive] = useState(false);
      const [growthdayQuarter, setGrowthdayQuarter] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [pins, setPins] = useState({});
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinMode, setPinMode] = useState(''); // 'setup' or 'verify'
      const [pinInput, setPinInput] = useState(['', '', '', '']);
      const [pinConfirm, setPinConfirm] = useState(['', '', '', '']);
      const [pinError, setPinError] = useState('');
      const [firebaseTeams, setFirebaseTeams] = useState(null);
      
      // Firebase teams 또는 기본 TEAMS_DATA 사용
      const activeTeamsData = React.useMemo(() => {
        if (firebaseTeams) {
          const converted = {};
          Object.entries(firebaseTeams).forEach(([key, data]) => {
            const displayName = data.displayName || key;
            converted[displayName] = data.members || [];
          });
          return converted;
        }
        return TEAMS_DATA;
      }, [firebaseTeams]);
      
      const activeTeamColors = React.useMemo(() => {
        if (firebaseTeams) {
          const colors = {};
          Object.entries(firebaseTeams).forEach(([key, data]) => {
            const displayName = data.displayName || key;
            colors[displayName] = data.color || '#3182F6';
          });
          return colors;
        }
        return TEAM_COLORS;
      }, [firebaseTeams]);
      
      const regularTeams = React.useMemo(() => {
        return Object.fromEntries(Object.entries(activeTeamsData).filter(([team]) => team !== "대표이사실"));
      }, [activeTeamsData]);
      
      const regularMembers = React.useMemo(() => {
        return Object.values(regularTeams).flat();
      }, [regularTeams]);
      
      const generateDynamicUploadStatus = React.useCallback(() => {
        const status = {};
        Object.entries(regularTeams).forEach(([team, members]) => {
          members.forEach(member => {
            status[member] = { team, weeks: {} };
          });
        });
        return status;
      }, [regularTeams]);
      
      const weeks = generateRecentWeeks(5);
      const [selectedWeek, setSelectedWeek] = useState(weeks[weeks.length - 1]?.weekId || '');
      const [toast, setToast] = useState(null);
      const isCEO = loggedInUser?.team === "대표이사실";

      // Firebase 실시간 리스너
      useEffect(() => {
        if (!db) {
          setIsLoading(false);
          return;
        }

        // 타임아웃 설정 (5초 후에도 로딩 중이면 강제 해제)
        const timeout = setTimeout(() => {
          setIsLoading(false);
          console.log('Firebase 연결 타임아웃');
        }, 5000);

        // Teams 데이터 리스너 (먼저 로드)
        const teamsRef = db.ref('teams');
        teamsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) setFirebaseTeams(data);
        }, (error) => console.error('teams 로드 오류:', error));

        // 업로드 상태 리스너
        const uploadRef = db.ref('uploadStatus');
        uploadRef.on('value', (snapshot) => {
          clearTimeout(timeout);
          const data = snapshot.val();
          setUploadStatus(data || {});
          setIsLoading(false);
        }, (error) => {
          clearTimeout(timeout);
          console.error('Firebase 데이터 로드 오류:', error);
          setIsLoading(false);
        });

        // 점수 리스너
        const scoresRef = db.ref('scores');
        scoresRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) setScores(data);
        }, (error) => console.error('scores 로드 오류:', error));

        // 그로스데이 상태 리스너
        const growthdayRef = db.ref('growthday');
        growthdayRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setGrowthdayActive(data.active || false);
            setGrowthdayQuarter(data.quarter || '');
          }
        }, (error) => console.error('growthday 로드 오류:', error));

        // PIN 리스너
        const pinsRef = db.ref('pins');
        pinsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) setPins(data);
        }, (error) => console.error('pins 로드 오류:', error));

        return () => {
          clearTimeout(timeout);
          teamsRef.off();
          uploadRef.off();
          scoresRef.off();
          growthdayRef.off();
          pinsRef.off();
        };
      }, []);

      useEffect(() => {
        if (loggedInUser) localStorage.setItem(STORAGE_KEYS.LOGGED_IN_USER, JSON.stringify(loggedInUser));
        else localStorage.removeItem(STORAGE_KEYS.LOGGED_IN_USER);
      }, [loggedInUser]);

      const showToast = (message) => { setToast(message); setTimeout(() => setToast(null), 2500); };
      const handleLogin = (team, name) => { setLoggedInUser({ team, name }); showToast(`${name}님 환영합니다!`); };
      const handleLogout = () => { setLoggedInUser(null); setCurrentPage('upload'); showToast('로그아웃되었습니다'); };

      // PIN 관련 함수들
      const handleGrowthTabClick = () => {
        if (!loggedInUser) return;
        const userPin = pins[loggedInUser.name];
        if (!userPin) {
          // PIN 설정 모달 열기
          setPinMode('setup');
          setPinInput(['', '', '', '']);
          setPinConfirm(['', '', '', '']);
          setPinError('');
          setShowPinModal(true);
        } else {
          // PIN 확인 모달 열기
          setPinMode('verify');
          setPinInput(['', '', '', '']);
          setPinError('');
          setShowPinModal(true);
        }
      };

      const handlePinInputChange = (index, value, isConfirm = false) => {
        if (value.length > 1) value = value.slice(-1);
        if (!/^\d*$/.test(value)) return;
        
        if (isConfirm) {
          const newPin = [...pinConfirm];
          newPin[index] = value;
          setPinConfirm(newPin);
          if (value && index < 3) {
            setTimeout(() => document.getElementById(`pin-confirm-${index + 1}`)?.focus(), 0);
          }
        } else {
          const newPin = [...pinInput];
          newPin[index] = value;
          setPinInput(newPin);
          if (value && index < 3) {
            setTimeout(() => document.getElementById(`pin-input-${index + 1}`)?.focus(), 0);
          }
        }
      };

      const handlePinKeyDown = (index, e, isConfirm = false) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          const prevId = isConfirm ? `pin-confirm-${index - 1}` : `pin-input-${index - 1}`;
          document.getElementById(prevId)?.focus();
        }
      };

      const handlePinSetup = () => {
        const pin = pinInput.join('');
        const confirm = pinConfirm.join('');
        
        if (pin.length !== 4) {
          setPinError('PIN 4자리를 모두 입력해주세요');
          return;
        }
        if (pin !== confirm) {
          setPinError('PIN이 일치하지 않습니다');
          return;
        }
        
        db.ref(`pins/${loggedInUser.name}`).set(pin)
          .then(() => {
            setShowPinModal(false);
            setCurrentPage('growth');
            showToast('PIN이 설정되었습니다');
          })
          .catch((error) => {
            console.error('PIN 저장 오류:', error);
            setPinError('PIN 저장에 실패했습니다');
          });
      };

      const handlePinVerify = () => {
        const pin = pinInput.join('');
        const userPin = pins[loggedInUser.name];
        
        if (pin === userPin) {
          setShowPinModal(false);
          setCurrentPage('growth');
        } else {
          setPinError('PIN이 일치하지 않습니다');
          setPinInput(['', '', '', '']);
          setTimeout(() => document.getElementById('pin-input-0')?.focus(), 0);
        }
      };

      const handleUploadCheck = (member, weekId) => {
        if (!db) {
          showToast('Firebase 연결이 필요합니다');
          return;
        }
        
        const currentStatus = uploadStatus[member]?.weeks?.[weekId] || false;
        const newStatus = !currentStatus;
        
        db.ref(`uploadStatus/${member}/weeks/${weekId}`).set(newStatus)
          .then(() => {
            showToast(newStatus ? '업로드 완료 처리되었습니다' : '미업로드로 변경되었습니다');
          })
          .catch((error) => {
            console.error('Firebase 쓰기 오류:', error);
            showToast('저장 실패: Firebase 권한을 확인하세요');
          });
      };

      const handleScoreSubmit = (presenter, criteriaScores, isEdit = false) => {
        if (!db) {
          showToast('Firebase 연결이 필요합니다');
          return;
        }
        
        db.ref(`scores/${growthdayQuarter}/${presenter}/${loggedInUser.name}`).set({
          scores: criteriaScores,
          isCEO
        })
          .then(() => {
            showToast(isEdit ? `${presenter}님 점수가 수정되었습니다` : `${presenter}님에게 점수를 부여했습니다`);
          })
          .catch((error) => {
            console.error('Firebase 쓰기 오류:', error);
            showToast('저장 실패: Firebase 권한을 확인하세요');
          });
      };

      if (isLoading) {
        return (
          <div style={{minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: '#F7F8FA'}}>
            <div style={{textAlign: 'center'}}>
              <div style={{fontSize: '24px', marginBottom: '12px'}}>⏳</div>
              <div style={{color: '#666'}}>로딩 중...</div>
            </div>
          </div>
        );
      }

      if (!loggedInUser) return <LoginScreen onLogin={handleLogin} teamsData={activeTeamsData} teamColors={activeTeamColors} />;

      return (
        <div style={styles.container}>
          {toast && <div style={styles.toast}>✓ {toast}</div>}

          {/* PIN 모달 */}
          {showPinModal && (
            <div style={styles.pinModalOverlay}>
              <div style={styles.pinModal}>
                <button style={styles.pinModalClose} onClick={() => setShowPinModal(false)}>✕</button>
                <div style={styles.pinModalIcon}>🔐</div>
                <h3 style={styles.pinModalTitle}>
                  {pinMode === 'setup' ? 'PIN 설정' : 'PIN 입력'}
                </h3>
                <p style={styles.pinModalDesc}>
                  {pinMode === 'setup' 
                    ? '그로스데이 배점을 위한 4자리 PIN을 설정해주세요' 
                    : '그로스데이 배점을 위해 PIN을 입력해주세요'}
                </p>
                
                {pinMode === 'setup' && (
                  <div style={styles.pinInputLabel}>PIN 입력</div>
                )}
                <div style={styles.pinInputRow}>
                  {[0, 1, 2, 3].map(i => (
                    <input
                      key={i}
                      id={`pin-input-${i}`}
                      type="password"
                      inputMode="numeric"
                      maxLength={1}
                      value={pinInput[i]}
                      onChange={(e) => handlePinInputChange(i, e.target.value)}
                      onKeyDown={(e) => handlePinKeyDown(i, e)}
                      style={styles.pinInputBox}
                      autoFocus={i === 0}
                    />
                  ))}
                </div>
                
                {pinMode === 'setup' && (
                  <>
                    <div style={styles.pinInputLabel}>PIN 확인</div>
                    <div style={styles.pinInputRow}>
                      {[0, 1, 2, 3].map(i => (
                        <input
                          key={i}
                          id={`pin-confirm-${i}`}
                          type="password"
                          inputMode="numeric"
                          maxLength={1}
                          value={pinConfirm[i]}
                          onChange={(e) => handlePinInputChange(i, e.target.value, true)}
                          onKeyDown={(e) => handlePinKeyDown(i, e, true)}
                          style={styles.pinInputBox}
                        />
                      ))}
                    </div>
                  </>
                )}
                
                {pinError && <div style={styles.pinError}>{pinError}</div>}
                
                <button 
                  style={styles.pinSubmitBtn}
                  onClick={pinMode === 'setup' ? handlePinSetup : handlePinVerify}
                >
                  {pinMode === 'setup' ? 'PIN 설정' : '확인'}
                </button>
                
                {pinMode === 'verify' && (
                  <div style={styles.pinForgot}>PIN을 잊으셨나요? 관리자에게 문의해주세요.</div>
                )}
              </div>
            </div>
          )}

          <header style={styles.header}>
            <div style={styles.headerContent}>
              <div style={styles.logo} onClick={() => setCurrentPage('upload')}>
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                  <rect width="32" height="32" rx="8" fill="#3182F6"/>
                  <path d="M10 16L14 20L22 12" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                <span style={styles.logoText}>그로스보드</span>
              </div>
              <div style={styles.userSection}>
                <div style={styles.userAvatar} style={{...styles.userAvatar, backgroundColor: activeTeamColors[loggedInUser.team] || '#3182F6'}}>
                  {loggedInUser.name[0]}
                </div>

    function GrowthDayPage({ currentUser, scores, quarter, onScore, isCEO, teamsData, teamColors, regularMembers }) {
      const [selectedPresenter, setSelectedPresenter] = useState(null);
      const [criteriaScores, setCriteriaScores] = useState({});
      const [searchTerm, setSearchTerm] = useState('');
      const [isEditing, setIsEditing] = useState(false);

      const scoreMultiplier = isCEO ? 2 : 1;
      const maxTotalScore = 100 * scoreMultiplier;
      const availablePresenters = regularMembers.filter(m => m !== currentUser);

      const getMemberTeam = (name) => {
        for (const [team, members] of Object.entries(teamsData)) {
          if (members.includes(name)) return team;
        }
        return '';
      };

      const filteredPresenters = availablePresenters.filter(name => 
        name.includes(searchTerm) || getMemberTeam(name).includes(searchTerm)
      );

      const groupedPresenters = filteredPresenters.reduce((acc, name) => {
        const team = getMemberTeam(name);
        if (!acc[team]) acc[team] = [];
        acc[team].push(name);
        return acc;
      }, {});

      const hasVoted = (presenter) => scores[quarter]?.[presenter]?.[currentUser] !== undefined;

      const getMyScore = (presenter) => {
        const myData = scores[quarter]?.[presenter]?.[currentUser];
        if (!myData) return null;
        const baseScore = Object.values(myData.scores).reduce((a, b) => a + b, 0);
        return myData.isCEO ? baseScore * 2 : baseScore;
      };

      const getMyScoreDetail = (presenter) => {
        return scores[quarter]?.[presenter]?.[currentUser]?.scores || null;
      };

      const initScores = () => {
        const initial = {};
        SCORING_CRITERIA.forEach(c => { initial[c.id] = 0; });
        return initial;
      };

      const handleSelectPresenter = (name, edit = false) => {
        setSelectedPresenter(name);
        setIsEditing(edit);
        if (edit && hasVoted(name)) {
          setCriteriaScores(getMyScoreDetail(name));
        } else {
          setCriteriaScores(initScores());
        }
      };

      const handleScoreChange = (criteriaId, value, maxScore) => {
        let numValue = value === '' ? 0 : parseInt(value);
        numValue = Math.max(0, Math.min(maxScore, numValue));
        setCriteriaScores(prev => ({...prev, [criteriaId]: numValue}));
      };

      const getTotalScore = () => {
        const baseTotal = Object.values(criteriaScores).reduce((a, b) => a + b, 0);
        return isCEO ? baseTotal * 2 : baseTotal;
      };

      const scoredPresenters = Object.keys(scores[quarter] || {}).filter(
        presenter => scores[quarter]?.[presenter]?.[currentUser]
      );

      return (
        <div style={styles.page}>
          <div style={styles.pageHeader}>
            <h1 style={styles.pageTitle}>그로스데이 배점</h1>
            <div style={styles.quarterInfo}>
              <span style={styles.quarterBadge}>{quarter}</span>
              {isCEO && <span style={styles.ceoBadgeScore}>x2 적용</span>}
            </div>
          </div>

          {!selectedPresenter && (
            <>
              <input
                type="text"
                placeholder="발표자 이름 또는 팀 검색..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                style={styles.searchInput}
              />

              <div style={styles.presenterList}>
                {Object.entries(groupedPresenters).map(([team, members]) => (
                  <div key={team} style={styles.teamGroup}>
                    <div style={styles.teamHeader}>
                      <div style={{...styles.teamDot, backgroundColor: teamColors[team] || '#3182F6'}} />
                      <span>{team}</span>
                    </div>
                    {members.map(name => {
                      const voted = hasVoted(name);
                      return (
                        <button
                          key={name}
                          style={{...styles.presenterItem, ...(voted ? styles.presenterItemVoted : {})}}
                          onClick={() => handleSelectPresenter(name, false)}
                        >
                          <div style={{...styles.presenterAvatar, backgroundColor: teamColors[team] || '#3182F6'}}>{name[0]}</div>
                          <span style={styles.presenterName}>{name}</span>
                          {voted && <span style={styles.votedBadge}>✓ {getMyScore(name)}점</span>}
                        </button>
                      );
                    })}
                  </div>
                ))}
              </div>
            </>
          )}

          {selectedPresenter && (
            <div style={styles.scoringCard}>
              <div style={styles.scoringHeader}>
                <div style={styles.scoringPresenter}>
                  <div style={{...styles.scoringAvatar, backgroundColor: teamColors[getMemberTeam(selectedPresenter)] || '#3182F6'}}>{selectedPresenter[0]}</div>
                  <div>
                    <div style={styles.scoringName}>{selectedPresenter}</div>
                    <div style={styles.scoringTeam}>{getMemberTeam(selectedPresenter)}</div>
                  </div>
                </div>
                <button style={styles.closeBtn} onClick={() => setSelectedPresenter(null)}>✕</button>
              </div>

              {hasVoted(selectedPresenter) && !isEditing ? (
                <div style={styles.votedResult}>
                  <div style={styles.votedIcon}>✓</div>
                  <div style={styles.votedText}>평가 완료</div>
                  <div style={styles.votedScore}>{getMyScore(selectedPresenter)}점</div>
                  <button style={styles.editBtn} onClick={() => handleSelectPresenter(selectedPresenter, true)}>
                    점수 수정하기
                  </button>
                </div>
              ) : (
                <>
                  {isCEO && <div style={styles.ceoNotice}>⭐ 대표님의 배점은 총점에서 2배로 적용됩니다 (100점 → 200점)</div>}
                  
                  <div style={styles.criteriaList}>
                    {SCORING_CRITERIA.map(criteria => {
                      const currentValue = criteriaScores[criteria.id] || 0;
                      
                      return (
                        <div key={criteria.id} style={styles.criteriaItem}>
                          <div style={styles.criteriaHeader}>
                            <span style={styles.criteriaName}>{criteria.name}</span>
                            <span style={styles.criteriaMax}>최대 {criteria.maxScore}점</span>
                          </div>
                          <div style={styles.scoreInputWrapper}>
                            <input
                              type="number"
                              inputMode="numeric"
                              value={currentValue || ''}
                              placeholder="0"
                              onChange={(e) => handleScoreChange(criteria.id, e.target.value, criteria.maxScore)}
                              style={styles.scoreInput}
                            />
                            <span style={styles.scoreUnit}>점</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div style={styles.totalBar}>
                    <span style={styles.totalLabel}>총점 {isCEO && '(x2 적용)'}</span>
                    <span style={styles.totalValue}>{getTotalScore()} <span style={styles.totalMax}>/ {maxTotalScore}점</span></span>
                  </div>

                  <button
                    style={styles.submitBtn}
                    onClick={() => { onScore(selectedPresenter, criteriaScores, isEditing); setSelectedPresenter(null); }}
                  >
                    {isEditing ? '점수 수정 완료' : '점수 제출하기'}
                  </button>
                </>
              )}
            </div>
          )}

          {!selectedPresenter && scoredPresenters.length > 0 && (
            <div style={styles.myScoresSection}>
              <h3 style={styles.sectionTitle}>내가 평가한 발표자 ({scoredPresenters.length}명)</h3>
              <div style={styles.myScoresList}>
                {scoredPresenters.map(presenter => (
                  <button
                    key={presenter}
                    style={styles.myScoreItem}
                    onClick={() => handleSelectPresenter(presenter, true)}
                  >
                    <div style={{...styles.myScoreAvatar, backgroundColor: teamColors[getMemberTeam(presenter)] || '#3182F6'}}>{presenter[0]}</div>
                    <div style={styles.myScoreInfo}>
                      <span style={styles.myScoreName}>{presenter}</span>
                      <span style={styles.myScoreTeam}>{getMemberTeam(presenter)}</span>
                    </div>
                    <div style={styles.myScoreValue}>{getMyScore(presenter)}점</div>
                    <span style={styles.editIcon}>✎</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }
